name: Security Audit

on:
  schedule:
    - cron: '0 0 * * 1' # Mondays 00:00 UTC
  workflow_dispatch:
  push:
    paths:
      - 'src/rust/Cargo.lock'
      - 'src/rust/Cargo.toml'
  pull_request:
    paths:
      - 'src/rust/Cargo.lock'
      - 'src/rust/Cargo.toml'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/audit@v1
        with:
          file: src/rust/Cargo.lock
