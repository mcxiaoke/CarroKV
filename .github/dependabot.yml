version: 2
updates:
  - package-ecosystem: "cargo"
    directory: "/src/rust"
    schedule:
      interval: "weekly"

  - package-ecosystem: "nuget"
    directory: "/src/dotnet/src/Ckv"
    schedule:
      interval: "weekly"

  - package-ecosystem: "gomod"
    directory: "/src/go"
    schedule:
      interval: "weekly"

  - package-ecosystem: "gradle"
    directory: "/src/kotlin"
    schedule:
      interval: "weekly"

  - package-ecosystem: "pub"
    directory: "/src/dart"
    schedule:
      interval: "weekly"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
